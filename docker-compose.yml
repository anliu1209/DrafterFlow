# Docker Compose for the "①" self-hosted step (any VPS / Docker host).
# Uses the same image as Render — no code changes between the two.
# Put a reverse proxy (Caddy/Nginx) in front to add HTTPS.
services:
  drafterflow:
    build: .
    image: drafterflow:latest
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DF_HOST=0.0.0.0
      - DF_DATABASE_PATH=/app/data/drafterflow.db
      # Set to 1 only when HTTPS terminates at this container/proxy.
      - DF_COOKIE_SECURE=0
    volumes:
      - drafterflow-data:/app/data
    restart: unless-stopped

volumes:
  drafterflow-data:
